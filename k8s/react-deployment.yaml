apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-frontend
  namespace: distributeur
spec:
  replicas: 2
  selector:
    matchLabels:
      app: react
  template:
    metadata:
      labels:
        app: react
    spec:
      containers:
      - name: react
        image: distributeur-react:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: react-service
  namespace: distributeur
spec:
  selector:
    app: react
  ports:
  - port: 80
    targetPort: 80