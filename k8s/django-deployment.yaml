apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-backend
  namespace: distributeur
spec:
  replicas: 3
  selector:
    matchLabels:
      app: django
  template:
    metadata:
      labels:
        app: django
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: django
            topologyKey: "kubernetes.io/hostname"
      initContainers:
      - name: django-migrate
        image: distributeur-django:v1
        imagePullPolicy: Never
        command: ["python","manage.py","migrate","--noinput"]
        envFrom:
        - configMapRef:
            name: django-config
        - secretRef:
            name: mysql-secret
      containers:
      - name: django
        image: distributeur-django:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: django-config
        - secretRef:
            name: mysql-secret
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "768Mi"
        readinessProbe:
          httpGet:
            path: /health/
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 10
        livenessProbe:
          httpGet:
            path: /health/
            port: 8000
          initialDelaySeconds: 120
          periodSeconds: 20
          failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: django-service
  namespace: distributeur
spec:
  selector:
    app: django
  ports:
  - port: 8000
    targetPort: 8000